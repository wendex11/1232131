<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>БУРМАЛДа))0</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Exo+2:wght@700;800;900&family=Russo+One&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --purple: rgb(127, 93, 186);
      --cyan: rgb(131, 220, 230);

      --bg: #08080d;
      --card: #101019;
      --card2: #151522;

      --muted: #9898a8;

      --danger: #ff6e6e;
      --success: #75f3b3;
      --warning: #ffd36e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(127, 93, 186, 0.18),
          transparent 34%
        ),
        linear-gradient(
          180deg,
          #08080d 0%,
          #0b0b12 100%
        );

      color: #fff;

      font-family: "Cairo", sans-serif;
      font-weight: 900;
    }

    button,
    input {
      font: inherit;
      font-weight: 900;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =====================================================
       MENU
    ===================================================== */

    .menu-button {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1200;

      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid var(--cyan);
      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(127, 93, 186, 0.18),
          rgba(16, 16, 25, 0.98)
        );

      color: var(--cyan);
      font-size: 24px;

      cursor: pointer;

      box-shadow:
        0 0 16px rgba(131, 220, 230, 0.07);

      transition: 0.2s ease;
    }

    .menu-button:hover {
      transform: scale(1.05);

      background:
        linear-gradient(
          145deg,
          rgba(127, 93, 186, 0.34),
          rgba(16, 16, 25, 0.98)
        );

      box-shadow:
        0 0 22px rgba(131, 220, 230, 0.12);
    }

    .menu-button.menu-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* =====================================================
       CLEAR
    ===================================================== */

    .clear-button {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 900;

      padding: 12px 17px;

      border: 2px solid var(--cyan);
      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          rgba(127, 93, 186, 0.17),
          rgba(16, 16, 25, 0.98)
        );

      color: var(--cyan);
      font-size: 14px;

      cursor: pointer;

      box-shadow:
        0 0 18px rgba(131, 220, 230, 0.07);

      transition: 0.2s ease;
    }

    .clear-button:hover {
      transform: translateY(-2px);

      background:
        linear-gradient(
          145deg,
          rgba(127, 93, 186, 0.34),
          rgba(16, 16, 25, 0.98)
        );

      box-shadow:
        0 0 24px rgba(131, 220, 230, 0.11);
    }

    /* =====================================================
       PAGE
    ===================================================== */

    .page {
      width: min(1700px, calc(100% - 24px));
      margin: 0 auto;

      padding:
        82px
        0
        125px;
    }

    /* =====================================================
       TITLE
    ===================================================== */

    .site-title {
      margin: 0 0 24px;

      text-align: center;

      font-family: "Russo One", sans-serif;

      font-size:
        clamp(40px, 6vw, 76px);

      line-height: 0.95;
      letter-spacing: 1px;

      color: var(--cyan);

      text-shadow:
        0 0 8px rgba(131, 220, 230, 0.16),
        0 0 18px rgba(131, 220, 230, 0.20),
        0 0 34px rgba(127, 93, 186, 0.25);
    }

    /* =====================================================
       AI BUTTON
    ===================================================== */

    .ai-button-wrap {
      display: flex;
      justify-content: center;

      margin:
        0
        0
        30px;
    }

    .ai-button {
      min-width: 270px;

      padding:
        14px
        22px;

      border:
        2px solid
        var(--cyan);

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          rgba(127, 93, 186, 0.95),
          rgba(127, 93, 186, 0.50)
        );

      color: #fff;

      font-size: 16px;

      cursor: pointer;

      box-shadow:
        0 0 20px
        rgba(127, 93, 186, 0.10);

      transition:
        0.2s ease;
    }

    .ai-button:hover {
      transform: translateY(-2px);

      filter: brightness(1.10);

      box-shadow:
        0 0 28px
        rgba(127, 93, 186, 0.16);
    }

    .ai-button:disabled {
      opacity: 0.55;

      cursor: wait;

      transform: none;

      filter: none;
    }

    /* =====================================================
       LOADING / ERROR
    ===================================================== */

    .loading,
    .error {
      padding: 40px 20px;

      border:
        2px solid
        var(--purple);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(127, 93, 186, 0.10),
          rgba(16, 16, 25, 0.92)
        );

      text-align: center;

      color: var(--cyan);

      font-size: 18px;
    }

    .error {
      color: #ff9999;

      border-color:
        #ff6666;
    }

    /* =====================================================
       3 SELLER COLUMNS
    ===================================================== */

    .sellers-grid {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(410px, 1fr)
        );

      gap: 18px;

      align-items: start;

      overflow-x: auto;

      padding-bottom: 6px;
    }

    .seller {
      min-width: 410px;

      padding: 13px;

      border:
        2px solid
        var(--purple);

      border-radius: 21px;

      background:
        linear-gradient(
          145deg,
          rgba(127, 93, 186, 0.09),
          rgba(10, 10, 17, 0.98)
        );

      box-shadow:
        inset 0 0 28px
        rgba(127, 93, 186, 0.025),

        0 0 18px
        rgba(127, 93, 186, 0.025);
    }

    /* =====================================================
       SELLER HEADER
    ===================================================== */

    .seller-header {
      display: flex;
      flex-direction: column;

      gap: 10px;

      margin-bottom: 12px;
      padding: 13px;

      border:
        1px solid
        rgba(131, 220, 230, 0.30);

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          rgba(131, 220, 230, 0.025),
          rgba(0, 0, 0, 0.13)
        );
    }

    .seller-name {
      min-width: 0;

      text-align: center;

      font-family:
        "Russo One",
        sans-serif;

      font-size:
        clamp(21px, 2vw, 29px);

      line-height: 1.05;

      color: var(--cyan);

      overflow-wrap: anywhere;

      text-shadow:
        0 0 10px
        rgba(131, 220, 230, 0.08);
    }

    .seller-total {
      text-align: center;

      color: #fff;

      font-size: 14px;
    }

    .seller-total span {
      color: var(--cyan);

      font-size: 19px;
    }

    .sold-button {
      width: 100%;

      min-height: 44px;

      border:
        2px solid
        var(--cyan);

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(127, 93, 186, 0.95),
          rgba(127, 93, 186, 0.58)
        );

      color: #fff;

      cursor: pointer;

      box-shadow:
        0 0 16px
        rgba(127, 93, 186, 0.08);

      transition:
        0.2s ease;
    }

    .sold-button:hover {
      transform: translateY(-2px);

      filter: brightness(1.10);

      box-shadow:
        0 0 23px
        rgba(127, 93, 186, 0.14);
    }

    .sold-button.saved {
      background:
        rgba(117, 243, 179, 0.11);

      border-color:
        var(--success);

      color:
        var(--success);
    }

    /* =====================================================
       PRODUCTS
    ===================================================== */

    .products {
      display: flex;

      flex-direction: column;

      gap: 9px;
    }

    .product-card {
      display: grid;

      grid-template-columns:
        60px
        minmax(180px, 1fr)
        74px
        105px;

      align-items: center;

      gap: 10px;

      min-height: 80px;

      padding:
        9px
        10px;

      border:
        1px solid
        rgba(131, 220, 230, 0.28);

      border-radius: 15px;

      background:
        linear-gradient(
          90deg,
          rgba(16, 16, 25, 0.97),
          rgba(11, 11, 18, 0.97)
        );

      transition:
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
    }

    .product-card:hover {
      border-color:
        rgba(131, 220, 230, 0.60);
    }

    .product-card.has-quantity {
      border-color:
        var(--purple);

      background:
        linear-gradient(
          90deg,
          rgba(127, 93, 186, 0.18),
          rgba(16, 16, 25, 0.98)
        );

      box-shadow:
        inset 0 0 0 1px
        rgba(127, 93, 186, 0.10),

        0 0 13px
        rgba(127, 93, 186, 0.035);
    }

    .product-icon {
      width: 60px;
      height: 60px;

      object-fit: contain;

      padding: 4px;

      border:
        1px solid
        rgba(131, 220, 230, 0.24);

      border-radius: 12px;

      background:
        rgba(0, 0, 0, 0.24);
    }

    .product-info {
      min-width: 0;
      overflow: visible;
    }

    .product-name {
      margin: 0;

      font-family:
        "Exo 2",
        sans-serif;

      font-weight: 900;

      font-size:
        clamp(15px, 1.18vw, 20px);

      line-height: 1.08;

      color: #fff;

      white-space: normal;

      overflow-wrap: anywhere;
      word-break: normal;
    }

    .product-price {
      margin-top: 6px;
      margin-left: 10px;

      color:
        var(--cyan);

      font-size: 11px;

      line-height: 1.15;

      white-space: normal;

      overflow-wrap: anywhere;
    }

    /* =====================================================
       QUANTITY
    ===================================================== */

    .quantity-area {
      width: 74px;
      min-width: 74px;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: visible;
    }

    .quantity-input {
      display: block;

      width: 44px;
      min-width: 44px;
      max-width: none;

      padding:
        7px
        7px;

      border:
        2px solid
        var(--cyan);

      border-radius: 10px;

      background:
        #0a0a11;

      color:
        var(--cyan);

      text-align: center;
      text-align-last: center;

      outline: none;

      flex: 0 0 auto;

      /*
        Убираем стандартные spin-кнопки
        Firefox.
      */

      -moz-appearance:
        textfield;

      appearance:
        textfield;

      transition:
        width 0.12s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    /*
      Убираем стрелочки Chrome / Edge / Safari.
    */

    .quantity-input::-webkit-outer-spin-button,
    .quantity-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }

    .quantity-input:focus {
      border-color:
        var(--purple);

      box-shadow:
        0 0 0 3px
        rgba(127, 93, 186, 0.14),

        0 0 13px
        rgba(127, 93, 186, 0.08);
    }

    /* =====================================================
       SUM
    ===================================================== */

    .sum-area {
      width: 105px;
      min-width: 105px;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: visible;
    }

    .sum {
      display: block;

      width: 84px;
      min-width: 84px;

      text-align: center;

      line-height: 1;

      color:
        var(--purple);

      white-space: nowrap;

      transition:
        width 0.12s ease,
        color 0.15s ease;
    }

    .product-card.has-quantity .sum {
      color:
        var(--cyan);
    }

    /* =====================================================
       TOTAL
    ===================================================== */

    .bottom-total {
      margin-top: 11px;

      padding: 12px;

      border:
        1px solid
        var(--purple);

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(127, 93, 186, 0.09),
          rgba(127, 93, 186, 0.025)
        );

      text-align: center;
    }

    .bottom-total-label {
      color: #fff;

      font-size: 13px;
    }

    .bottom-total-value {
      display: block;

      margin-top: 4px;

      color:
        var(--cyan);

      font-size: 24px;

      line-height: 1;
    }

    /* =====================================================
       AI MODAL
    ===================================================== */

    .ai-overlay {
      position: fixed;

      inset: 0;

      z-index: 1500;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 16px;

      background:
        rgba(0, 0, 0, 0.78);

      backdrop-filter:
        blur(10px);
    }

    .ai-overlay.open {
      display: flex;
    }

    .ai-modal {
      width: min(720px, 100%);

      max-height:
        calc(100vh - 32px);

      overflow-y: auto;

      padding: 20px;

      border:
        2px solid
        var(--purple);

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(22, 20, 34, 0.99),
          rgba(10, 10, 17, 0.99)
        );

      box-shadow:
        0 20px 70px
        rgba(0, 0, 0, 0.55);
    }

    .ai-modal-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 18px;
    }

    .ai-modal-title {
      font-family:
        "Russo One",
        sans-serif;

      color:
        var(--cyan);

      font-size: 25px;
    }

    .ai-close {
      width: 42px;
      height: 42px;

      border:
        2px solid
        var(--cyan);

      border-radius: 12px;

      background:
        rgba(16, 16, 25, 0.95);

      color:
        var(--cyan);

      cursor: pointer;

      font-size: 22px;
    }

    .ai-dropzone {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      min-height: 230px;

      padding: 28px;

      border:
        2px dashed
        rgba(131, 220, 230, 0.48);

      border-radius: 17px;

      background:
        rgba(131, 220, 230, 0.025);

      text-align: center;

      cursor: pointer;

      transition:
        border-color 0.18s ease,
        background 0.18s ease;
    }

    .ai-dropzone:hover,
    .ai-dropzone.dragover {
      border-color:
        var(--cyan);

      background:
        rgba(127, 93, 186, 0.10);
    }

    .ai-dropzone-icon {
      font-size: 52px;
      line-height: 1;

      margin-bottom: 12px;
    }

    .ai-dropzone-title {
      color:
        var(--cyan);

      font-size: 20px;
    }

    .ai-dropzone-subtitle {
      margin-top: 6px;

      color:
        var(--muted);

      font-size: 13px;
    }

    #aiFileInput {
      display: none;
    }

    .ai-status {
      min-height: 25px;

      margin-top: 14px;

      color:
        var(--muted);

      text-align: center;

      font-size: 14px;
    }

    .ai-status.loading {
      padding: 0;

      border: none;
      border-radius: 0;

      background: transparent;

      color:
        var(--cyan);

      font-size: 14px;
    }

    .ai-results {
      margin-top: 14px;
    }

    .ai-results-title {
      margin-bottom: 10px;

      color:
        var(--cyan);

      font-size: 17px;
    }

    .ai-result-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ai-result-item {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        90px
        90px;

      gap: 10px;

      align-items: center;

      padding: 10px 12px;

      border:
        1px solid
        rgba(131, 220, 230, 0.22);

      border-radius: 12px;

      background:
        rgba(255, 255, 255, 0.025);
    }

    .ai-result-name {
      color: #fff;

      font-family:
        "Exo 2",
        sans-serif;

      overflow-wrap: anywhere;
    }

    .ai-result-quantity {
      text-align: center;

      color:
        var(--cyan);
    }

    .ai-result-confidence {
      text-align: right;

      color:
        var(--success);

      font-size: 12px;
    }

    .ai-result-empty {
      padding: 18px;

      border:
        1px solid
        rgba(255, 110, 110, 0.35);

      border-radius: 12px;

      color:
        #ffaaaa;

      text-align: center;
    }

    .ai-total-box {
      margin-top: 14px;

      padding: 16px;

      border:
        2px solid
        var(--purple);

      border-radius: 15px;

      background:
        rgba(127, 93, 186, 0.08);

      text-align: center;
    }

    .ai-total-label {
      font-size: 14px;
    }

    .ai-total-value {
      margin-top: 4px;

      color:
        var(--cyan);

      font-size: 30px;

      line-height: 1;
    }

    .ai-actions {
      display: flex;

      gap: 10px;

      margin-top: 14px;
    }

    .ai-action-button {
      flex: 1;

      min-height: 44px;

      border:
        2px solid
        var(--cyan);

      border-radius: 12px;

      background:
        rgba(127, 93, 186, 0.14);

      color: #fff;

      cursor: pointer;
    }

    .ai-action-button:hover {
      background:
        rgba(127, 93, 186, 0.28);
    }

    .ai-action-button.primary {
      background:
        linear-gradient(
          135deg,
          rgba(127, 93, 186, 0.95),
          rgba(127, 93, 186, 0.55)
        );
    }

    .ai-action-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =====================================================
       MENU
    ===================================================== */

    .menu-overlay {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: none;

      padding: 14px;

      background:
        rgba(0, 0, 0, 0.72);

      backdrop-filter:
        blur(8px);
    }

    .menu-overlay.open {
      display: flex;

      align-items: flex-start;

      justify-content: flex-start;
    }

    .side-menu {
      width: min(420px, 100%);

      max-height:
        calc(100vh - 28px);

      overflow-y: auto;

      padding: 18px;

      border:
        2px solid
        var(--purple);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(22, 20, 34, 0.99),
          rgba(10, 10, 17, 0.99)
        );

      box-shadow:
        0 15px 50px
        rgba(0, 0, 0, 0.45);
    }

    .menu-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 14px;
    }

    .menu-title {
      font-family:
        "Russo One",
        sans-serif;

      font-size: 24px;

      color:
        var(--cyan);
    }

    .close-menu {
      width: 42px;
      height: 42px;

      border:
        2px solid
        var(--cyan);

      border-radius: 12px;

      background:
        rgba(16, 16, 25, 0.90);

      color:
        var(--cyan);

      cursor: pointer;

      font-size: 22px;
    }

    /* =====================================================
       HISTORY
    ===================================================== */

    .history-empty {
      padding: 20px 4px;

      color:
        var(--muted);

      text-align: center;
    }

    .history-list {
      display: flex;

      flex-direction: column;

      gap: 10px;
    }

    .history-item {
      padding: 13px;

      border:
        1px solid
        rgba(131, 220, 230, 0.24);

      border-radius: 14px;

      background:
        rgba(255, 255, 255, 0.025);
    }

    .history-head {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 10px;
    }

    .history-seller {
      color:
        var(--cyan);

      font-family:
        "Exo 2",
        sans-serif;

      font-size: 18px;

      overflow-wrap: anywhere;
    }

    .history-date {
      color:
        var(--muted);

      font-size: 12px;

      text-align: right;

      white-space: nowrap;
    }

    .history-total {
      margin-top: 8px;

      color: #fff;
    }

    .history-total span {
      color:
        var(--cyan);

      font-size: 20px;
    }

    .history-meta {
      margin-top: 4px;

      color:
        var(--muted);

      font-size: 12px;

      font-weight: 800;
    }

    .history-actions {
      display: flex;

      gap: 8px;

      margin-top: 10px;
    }

    .history-actions button {
      flex: 1;

      min-height: 40px;

      border:
        1px solid
        var(--cyan);

      border-radius: 10px;

      background:
        rgba(127, 93, 186, 0.14);

      color: #fff;

      cursor: pointer;

      font-size: 13px;
    }

    .history-actions button:hover {
      background:
        rgba(127, 93, 186, 0.30);
    }

    .history-actions .delete-history {
      border-color:
        var(--danger);

      color:
        #ffaaaa;

      background:
        rgba(255, 70, 70, 0.06);
    }

    .status-message {
      min-height: 22px;

      margin-top: 10px;

      color:
        var(--success);

      text-align: center;

      font-size: 13px;
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 1250px) and (min-width: 851px) {

    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHtml(value) {

      return String(
        value ?? ""
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    function cleanName(value) {

      let name =
        String(
          value ?? ""
        ).trim();


      name =
        name.replace(
          /^\s*\d+(?:[.,]\d+)?\s*/u,
          ""
        );


      name =
        name.trim();


      if (
        /^\d+(?:[.,]\d+)?$/u.test(
          name
        )
      ) {

        return "";

      }


      if (
        name.toLowerCase() ===
        "коффе"
      ) {

        return "Кофе";

      }


      return name;

    }


    function normalizeProductName(
      value
    ) {

      return String(
        value ?? ""
      )

        .toLowerCase()

        .replace(
          /ё/g,
          "е"
        )

        .replace(
          /\s+/g,
          " "
        )

        .trim();

    }


    function toNumber(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return 0;

      }


      const text =
        String(value)

          .replace(
            /\u00A0/g,
            ""
          )

          .replace(
            /\s/g,
            ""
          )

          .replace(
            ",",
            "."
          );


      if (!text) {

        return 0;

      }


      const number =
        Number(text);


      return Number.isFinite(
        number
      )
        ? number
        : 0;

    }


    function formatMoney(value) {

      const number =
        Number(value) || 0;


      return (

        number.toLocaleString(
          "ru-RU",
          {
            maximumFractionDigits: 2
          }
        ) +

        " ₽"

      );

    }


    function formatNumber(value) {

      const number =
        Number(value) || 0;


      return number.toLocaleString(
        "ru-RU",
        {
          maximumFractionDigits: 2
        }
      );

    }


    function formatConfidence(
      value
    ) {

      const number =
        Number(value);


      if (
        !Number.isFinite(number)
      ) {

        return "—";

      }


      return (
        Math.max(
          0,
          Math.min(
            100,
            Math.round(
              number * 100
            )
          )
        ) +
        "%"
      );

    }


    /* =====================================================
       CSV
    ===================================================== */

    function parseCsv(text) {

      const rows = [];

      let row = [];

      let cell = "";

      let insideQuotes = false;


      for (
        let i = 0;
        i < text.length;
        i++
      ) {

        const char =
          text[i];

        const next =
          text[i + 1];


        if (
          char === '"' &&
          insideQuotes &&
          next === '"'
        ) {

          cell += '"';

          i++;

          continue;

        }


        if (
          char === '"'
        ) {

          insideQuotes =
            !insideQuotes;

          continue;

        }


        if (
          char === "," &&
          !insideQuotes
        ) {

          row.push(cell);

          cell = "";

          continue;

        }


        if (
          (
            char === "\n" ||
            char === "\r"
          ) &&
          !insideQuotes
        ) {

          if (
            char === "\r" &&
            next === "\n"
          ) {

            i++;

          }


          row.push(cell);

          cell = "";


          if (
            row.some(
              item =>
                String(item)
                  .trim() !== ""
            )
          ) {

            rows.push(row);

          }


          row = [];

          continue;

        }


        cell += char;

      }


      if (
        cell !== "" ||
        row.length > 0
      ) {

        row.push(cell);


        if (
          row.some(
            item =>
              String(item)
                .trim() !== ""
          )
        ) {

          rows.push(row);

        }

      }


      return rows;

    }


    /* =====================================================
       BUILD SELLERS
    ===================================================== */

    function buildSellers(
      rows
    ) {

      const sellers = [

        {
          name:
            "Логово Хайзенберга",

          products: []

        },

        {
          name:
            "Staraptor",

          products: []

        },

        {
          name:
            "WhiteFox",

          products: []

        }

      ];


      const iconIndexes = {

        "Логово Хайзенберга": 0,

        "Staraptor": 0,

        "WhiteFox": 0

      };


      for (
        const row of rows
      ) {

        /* =========================
           LOGOVO
        ========================== */

        const logovoName =
          cleanName(
            row[0]
          );


        const logovoPrice =
          toNumber(
            row[1]
          );


        if (
          logovoName &&
          !/кол-во|сумма/i.test(
            logovoName
          ) &&
          logovoPrice > 0
        ) {

          const index =
            iconIndexes[
              "Логово Хайзенберга"
            ];


          sellers[0]
            .products
            .push({

              name:
                logovoName,

              price:
                logovoPrice,

              quantity:
                0,

              icon:
                SELLER_ICONS[
                  "Логово Хайзенберга"
                ][index] || ""

            });


          iconIndexes[
            "Логово Хайзенберга"
          ]++;

        }


        /* =========================
           STARAPTOR
        ========================== */

        const staraptorName =
          cleanName(
            row[4]
          );


        const staraptorPrice =
          toNumber(
            row[5]
          );


        if (
          staraptorName &&
          !/кол-во|сумма/i.test(
            staraptorName
          ) &&
          staraptorPrice > 0
        ) {

          const index =
            iconIndexes[
              "Staraptor"
            ];


          sellers[1]
            .products
            .push({

              name:
                staraptorName,

              price:
                staraptorPrice,

              quantity:
                0,

              icon:
                SELLER_ICONS[
                  "Staraptor"
                ][index] || ""

            });


          iconIndexes[
            "Staraptor"
          ]++;

        }


        /* =========================
           WHITEFOX
        ========================== */

        let whiteFoxName =
          cleanName(
            row[8]
          );


        let whiteFoxPrice =
          toNumber(
            row[9]
          );


        if (
          whiteFoxName &&
          whiteFoxName.toLowerCase() ===
          "мясо"
        ) {

          const meatNames = [

            "Мясо шавки",

            "Мясо кабана",

            "Мясо хрюши"

          ];


          const index =
            iconIndexes[
              "WhiteFox"
            ];


          if (
            index < 3
          ) {

            whiteFoxName =
              meatNames[index];

            whiteFoxPrice =
              3000;

          }

        }


        if (
          whiteFoxName &&
          !/кол-во|сумма/i.test(
            whiteFoxName
          ) &&
          whiteFoxPrice > 0
        ) {

          const index =
            iconIndexes[
              "WhiteFox"
            ];


          sellers[2]

              price:
                whiteFoxPrice,

              quantity:
                0,

              icon:
                SELLER_ICONS[
                  "WhiteFox"
                ][index] || ""

            });


          iconIndexes[
            "WhiteFox"
          ]++;

        }

      }


      return sellers;

    }


    /* =====================================================
       STORAGE
    ===================================================== */

    function getQuantityStorage() {

      try {

        const raw =
          localStorage.getItem(
            QUANTITY_STORAGE_KEY
          );


        if (!raw) {

          return {};

        }


        const parsed =
          JSON.parse(
            raw
          );


        return (
          parsed &&
          typeof parsed === "object"
        )
          ? parsed
          : {};

      } catch {

        return {};

      }

    }


    function saveQuantities() {

      const data = {};


      state.sellers.forEach(
        seller => {

          seller.products.forEach(
            product => {

              data[
                seller.name +
                "::" +
                product.name
              ] =
                product.quantity;

            }
          );

        }
      );


      try {

        localStorage.setItem(
          QUANTITY_STORAGE_KEY,
          JSON.stringify(
            data
          )
        );

      } catch {}

    }


    function restoreQuantities() {

      const stored =
        getQuantityStorage();


      state.sellers.forEach(
        seller => {

          seller.products.forEach(
            product => {

              const key =
                seller.name +
                "::" +
                product.name;


              if (
                Object.prototype.hasOwnProperty.call(
                  stored,
                  key
                )
              ) {

                product.quantity =
                  Math.max(
                    0,
                    Math.floor(
                      toNumber(
                        stored[key]
                      )
                    )
                  );

              }

            }
          );

        }
      );

    }


    function loadHistory() {

        const parsed =

            raw

        return Array.isArray(
          parsed

          ? parsed
          : [];

      } catch {

        return [];

      }

    }


    function saveHistory() {

        localStorage.setItem(

            state.history

      } catch {}

    }


    /* =====================================================
       TOTALS
    ===================================================== */

    function getSellerTotal(
      seller
    ) {

      return seller.products.reduce(

        (
          total,
          product
        ) =>

          total +
          product.price *
          product.quantity,

        0

      );

    }


    /* =====================================================
       WIDTHS
    ===================================================== */

    function resizeQuantityInput(
      input
    ) {

      const value =
        String(
          input.value || "0"
        );


      /*
        Только сам input меняет ширину.
        Родитель остаётся по центру.

        Поэтому:
        1
        12
        123
        1234

        расходятся одинаково
        влево и вправо.
      */

      const width =
        Math.max(
          44,
          value.length * 14 + 16
        );


      input.style.width =
        width + "px";

    }


    function resizeSum(
      element
    ) {

      const value =
        String(
          element.textContent ||
          "0 ₽"
        );


      const width =
        Math.max(
          84,
          Math.min(
            140,
            value.length * 8 + 18
          )
        );


      element.style.width =
        width + "px";

    }


    /* =====================================================
       UPDATE
    ===================================================== */

    function updateSellerUI(
      sellerIndex
    ) {

      const seller =
        state.sellers[
          sellerIndex
        ];


      if (!seller) {

        return;

      }


      let total = 0;


      seller.products.forEach(

        (
          product,
          productIndex
        ) => {

          total +=
            product.price *
            product.quantity;


          const input =
            document.querySelector(
              `input[data-seller="${sellerIndex}"][data-product="${productIndex}"]`
            );


          const card =
            document.querySelector(
              `.product-card[data-seller="${sellerIndex}"][data-product="${productIndex}"]`
            );


          const sum =
            document.querySelector(
              `.sum[data-seller="${sellerIndex}"][data-product="${productIndex}"]`
            );


          if (input) {

            input.value =
              product.quantity;

            resizeQuantityInput(
              input
            );

          }


          if (sum) {

            sum.textContent =
              formatMoney(
                product.price *
                product.quantity
              );

            resizeSum(
              sum
            );

          }


          if (card) {

            card.classList.toggle(
              "has-quantity",
              product.quantity > 0
            );

          }

        }

      );


      const sellerTotal =
        document.querySelector(
          `.seller-total-value[data-seller="${sellerIndex}"]`
        );


      const bottomTotal =
        document.querySelector(
          `.bottom-total-value[data-seller="${sellerIndex}"]`
        );


      if (sellerTotal) {

        sellerTotal.textContent =
          formatMoney(
            total
          );

      }


      if (bottomTotal) {

        bottomTotal.textContent =
          formatMoney(
            total
          );

      }

    }


    function updateAllUI() {

      state.sellers.forEach(
        (
          _,
          index
        ) => {

          updateSellerUI(
            index
          );

        }
      );

    }


    /* =====================================================
       RENDER SITE
    ===================================================== */

    function render() {

      if (

    /* =====================================================
       SOLD
    ===================================================== */

    function markSellerAsSold(
      sellerIndex,
      button
    ) {

      const seller =
        state.sellers[
          sellerIndex
        ];


      if (!seller) {

        return;

      }


      const snapshot =
        seller.products.map(

          product => ({

            name:
              product.name,

            price:
              product.price,

            quantity:
              product.quantity

          })

        );


      const total =
        getSellerTotal(
          seller
        );


      const selectedPositions =
        seller.products.filter(

          product =>
            product.quantity > 0

        ).length;


      const entry = {

        id:
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2),

        date:
          new Date().toISOString(),

        seller:
          seller.name,

        total,

        selectedPositions,

        products:
          snapshot

      };


      state.history.unshift(
        entry
      );


      if (
        state.history.length > 100
      ) {

        state.history =
          state.history.slice(
            0,
            100
          );

      }


      saveHistory();

      renderHistory();


      const oldText =
        button.textContent;


      button.textContent =
        "✓ Сохранено";


      button.classList.add(
        "saved"
      );


      setTimeout(
        () => {

          button.textContent =
            oldText;

          button.classList.remove(
            "saved"
          );

        },
        1300
      );

    }


    /* =====================================================
       HISTORY
    ===================================================== */

    function formatDate(
      dateString
    ) {

      const date =
        new Date(
          dateString
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "Неизвестная дата";

      }


      return date.toLocaleString(
        "ru-RU",
        {

          day: "2-digit",

          month: "2-digit",

          year: "numeric",

          hour: "2-digit",

          minute: "2-digit"

        }
      );

    }

    function restoreHistoryEntry(
      id
    ) {

      const entry =
        state.history.find(
          item =>
            item.id === id
        );


      if (!entry) {

        return;

      }


      const seller =
        state.sellers.find(
          item =>
            item.name ===
            entry.seller
        );


      if (!seller) {

        return;

      }


      seller.products.forEach(
        product => {

          product.quantity =
            0;

        }
      );


      entry.products.forEach(
        savedProduct => {

          const product =
            seller.products.find(
              item =>
                item.name ===
                savedProduct.name
            );


          if (product) {

            product.quantity =
              Math.max(
                0,
                Math.floor(
                  toNumber(
                    savedProduct.quantity
                  )
                )
              );

          }

        }
      );


      saveQuantities();

      updateAllUI();


      menuStatus.textContent =
        `Восстановлено: ${seller.name}`;


      setTimeout(
        () => {

          menuStatus.textContent =
            "";

        },
        1500
      );

    }


    function deleteHistoryEntry(
      id
    ) {

      state.history =
        state.history.filter(
          item =>
            item.id !== id
        );


      saveHistory();

      renderHistory();

    }

          event.dataTransfer?.files?.[0];


        if (!file) {

        }


        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          setAiStatus(
            "Нужен файл изображения PNG, JPG или WEBP.",
            "error"
          );

          return;

        }


        processAiImage(
          file
        );

      }
    );


    /* =====================================================
       IMAGE TO DATA URL
    ===================================================== */

    function fileToDataUrl(
      file
    ) {

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const reader =
            new FileReader();


          reader.onload = () =>
            resolve(
              String(
                reader.result
              )
            );


          reader.onerror = () =>
            reject(
              new Error(
                "Не удалось прочитать изображение."
              )
            );


          reader.readAsDataURL(
            file
          );

        }
      );

    }


    /* =====================================================
       AI STATUS
    ===================================================== */

    function setAiStatus(
      message,
      type = "normal"
    ) {

      aiStatus.textContent =
        message;


      aiStatus.className =
        "ai-status";


      if (
        type === "loading"
      ) {

        aiStatus.classList.add(
          "loading"
        );

      }


      if (
        type === "error"
      ) {

        aiStatus.style.color =
          "#ffaaaa";

      }


      if (
        type === "success"
      ) {

        aiStatus.style.color =
          "var(--success)";

      }

    }


    /* =====================================================
       PROCESS IMAGE
    ===================================================== */

    async function processAiImage(
      file
    ) {

      /*
        Ограничиваем размер,
        чтобы случайно не отправить огромный файл.
      */

      if (
        file.size >
        12 * 1024 * 1024
      ) {

        setAiStatus(
          "Скриншот слишком большой. Максимум 12 МБ.",
          "error"
        );

        return;

      }


      if (
        ![
          "image/png",
          "image/jpeg",
          "image/webp"
        ].includes(
          file.type
        )
      ) {

        setAiStatus(
          "Поддерживаются только PNG, JPG и WEBP.",
          "error"
        );

        return;

      }


      try {

        state.aiImageFile =
          file;


        setAiStatus(
          "ИИ анализирует скриншот...",
          "loading"
        );


        aiResults.innerHTML =
          "";


        openAiButton.disabled =
          true;


        const dataUrl =
          await fileToDataUrl(
            file
          );


        const response =
          await fetch(
            "/api/recognize",
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  image: dataUrl
                })

            }
          );


        let payload =
          null;


        try {

          payload =
            await response.json();

        } catch {

          payload =
            null;

        }


        if (
          !response.ok
        ) {

          throw new Error(
            payload?.error ||
            "Сервер не смог обработать изображение."
          );

        }


        if (
          !payload ||
          !Array.isArray(
            payload.items
          )
        ) {

          throw new Error(
            "ИИ вернул некорректный результат."
          );

        }


        applyAiRecognizedResult(
          payload.items
        );


      } catch (error) {

        console.error(
          error
        );


        setAiStatus(
          error?.message ||
          "Не удалось распознать скриншот.",
          "error"
        );

        aiResults.innerHTML =
          "";

      } finally {

        openAiButton.disabled =
          false;

      }

    }


    /* =====================================================
       MATCH AI RESULTS WITH SITE PRODUCTS
    ===================================================== */

    function applyAiRecognizedResult(
      items
    ) {

      const merged =
        new Map();


      /*
        Разрешённые товары берём
        непосредственно из сайта.
      */

      const catalog = [];


      state.sellers.forEach(
        seller => {

          seller.products.forEach(
            product => {

              catalog.push({
                seller:
                  seller.name,

                name:
                  product.name,

                price:
                  product.price
              });

            }
          );

        }
      );


      /*
        Строго сопоставляем по названию.
      */

      for (
        const item of items
      ) {

        const aiName =
          normalizeProductName(
            item.name
          );


        if (!aiName) {

          continue;

        }


        const match =
          catalog.find(
            catalogItem =>
              normalizeProductName(
                catalogItem.name
              ) === aiName
          );


        if (!match) {

          continue;

        }


        const quantity =
          Math.max(
            0,
            Math.floor(
              toNumber(
                item.quantity
              )
            )
          );


        if (
          quantity <= 0
        ) {

          continue;

        }


        const key =
          match.seller +
          "::" +
          match.name;


        if (
          !merged.has(key)
        ) {

          merged.set(
            key,
            {
              seller:
                match.seller,

              name:
                match.name,

              price:
                match.price,

              quantity: 0,

              confidence:
                Number(
                  item.confidence
                )
            }
          );

        }


        const result =
          merged.get(key);


        result.quantity +=
          quantity;


        if (
          Number.isFinite(
            Number(
              item.confidence
            )
          )
        ) {

          result.confidence =
            Math.min(
              Number(
                result.confidence
              ) || 1,

              Number(
                item.confidence
              )
            );

        }

      }


      state.aiResults =
        Array.from(
          merged.values()
        );


      state.aiTotal =
        state.aiResults.reduce(

          (
            total,
            item
          ) =>

            total +
            item.price *
            item.quantity,

          0
        );


      renderAiResults();


      if (
        state.aiResults.length
      ) {

        setAiStatus(
          "Распознавание завершено. Проверь результат перед применением.",
          "success"
        );

      } else {

        setAiStatus(
          "ИИ не нашёл ни одного из твоих товаров.",
          "error"
        );

      }

    }

    /* =====================================================
       APPLY AI RESULT
    ===================================================== */

    function applyAiResultToTable() {

      /*
        ВАЖНО:
        Сначала обнуляем только товары,
        которые присутствуют в результате.
        Остальные текущие количества
        не трогаем.
      */

      state.aiResults.forEach(
        item => {

          const seller =
            state.sellers.find(
              sellerItem =>
                sellerItem.name ===
                item.seller
            );


          if (!seller) {

            return;

          }


          const product =
            seller.products.find(
              productItem =>
                productItem.name ===
                item.name
            );


          if (!product) {

            return;

          }


          product.quantity =
            item.quantity;

        }
      );


      saveQuantities();

      updateAllUI();


      setAiStatus(
        "✓ Значения применены к таблице.",
        "success"
      );


      setTimeout(
        () => {

          closeAiModal();

        },
        900
      );

    }


    /* =====================================================
       LOAD PRODUCTS
    ===================================================== */

    async function loadProducts() {

      try {

        const response =
          await fetch(

            SHEET_URL +
            "&t=" +
            Date.now(),

            {
              cache:
                "no-store"
            }

          );


        if (!response.ok) {

          throw new Error(
            "Ошибка загрузки таблицы: " +
            response.status
          );

        }


        const csv =
          await response.text();


        const rows =
          parseCsv(
            csv
          );


        state.sellers =
          buildSellers(
            rows
          );


        restoreQuantities();


        render();


        updateAllUI();


        renderHistory();

      } catch (error) {

        console.error(
          error
        );


        app.innerHTML = `

          <div class="error">

            Не удалось загрузить товары
            из Google Таблицы.

            <br><br>

            Проверь публикацию таблицы
            и доступ к CSV.

          </div>

        `;

      }

    }


    loadProducts();

  </script>

</body>
</html>
